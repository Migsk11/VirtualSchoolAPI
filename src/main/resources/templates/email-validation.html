<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de acesso</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #0f1d2c;
    font-family: Arial, Helvetica, sans-serif;
">

    <div style="
        width: 100%;
        padding: 40px 0;
    ">

        <div style="
            max-width: 500px;
            margin: 0 auto;
            background-color: #1d2e41;
            border-radius: 12px;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
        ">



<h1 style="
                margin: 0 0 15px 0;
                color: #ffffff;
                font-size: 26px;
            ">
                Chave de acesso
            </h1>
            
            

            <p style="
                margin: 0 0 30px 0;
                color: #919191;
                font-size: 16px;
                line-height: 1.5;
            ">
                Utilize a chave abaixo para liberar o seu acesso.
            </p>
            
            
            
            <div style="
                display: inline-block;
                padding: 18px 30px;
                background-color: #283c53;
                border-radius: 8px;
                margin-bottom: 25px;
            ">

<span style="
                    font-size: 32px;
                    font-weight: bold;
                    letter-spacing: 8px;
                    color: #ffffff;
                ">
                    {{KEY_VALIDATION}}
                </span>
                
            </div>
            
            <p style="
                margin: 0 0 10px 0;
                color: #979797;
                font-size: 14px;
            ">
                Essa chave é válida por 15 minutos.
            </p>


            <p style="
                margin: 0 0 10px 0;
                color: #919191;
                font-size: 12px;
            ">
                Horario da solicitação: {{REQUEST_TIME}}
            </p>

            <p style="
                margin: 20px 0 0 0;
                color: #979797;
                font-size: 12px;
                line-height: 1.5;
            ">
                Este é um e-mail automático e não recebe respostas.
            </p>

            <p style="
                margin: 20px 0 0 0;
                color: #979797;
                font-size: 12px;
                line-height: 1.5;
            ">
                Caso você não tenha solicitado este código,
                ignore este e-mail.
            </p>
            
        </div>

    </div>

</body>
</html>
